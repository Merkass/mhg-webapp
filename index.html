<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Сервис mhg</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff6f1;--bg2:#ffe9ef;--card:#ffffff;--text:#3b2f3a;--muted:#8d7c8a;--accent:#ff8fab;--accent-d:#e8688b;--accent-soft:#ffe1ea;--ok:#4fae78;--warn:#e89a4c;--bad:#dd6574;--line:#f1e2df;--shadow:0 6px 22px rgba(120,80,100,.09);--r:18px}
[data-theme=dark]{--bg:#17131d;--bg2:#2a2036;--card:#241e2e;--text:#f4eaf1;--muted:#a899aa;--accent:#ff9bb7;--accent-d:#ff7aa0;--accent-soft:#3d2a45;--ok:#6cd09a;--warn:#f0ac66;--bad:#ff8794;--line:#352c40;--shadow:0 6px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
#view{max-width:640px;margin:0 auto;padding:14px 14px 10px}
h2{margin:6px 2px 12px;font-size:21px}
h3{margin:18px 2px 8px;font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--bg2));border-radius:24px;padding:18px;margin-bottom:14px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none}
.hello{font-size:19px;font-weight:700}
.role-chip{display:inline-block;margin-top:4px;background:var(--card);color:var(--accent-d);font-weight:700;padding:3px 12px;border-radius:99px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:transform .12s}
.tile:active{transform:scale(.97)}.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.tile .e{font-size:26px}.tile b{font-size:15px}.tile span{font-size:12.5px;color:var(--muted)}
.banner{display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border-radius:var(--r);padding:13px 15px;margin-bottom:12px;cursor:pointer;font-weight:600}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;cursor:pointer}
.item .ico{font-size:24px}.item .t{font-weight:650;font-size:15px}.item .s{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-d);margin-left:4px;white-space:nowrap}
.st-done{background:rgba(79,174,120,.15);color:var(--ok)}.st-rejected{background:rgba(221,101,116,.15);color:var(--bad)}.st-work{background:rgba(232,154,76,.16);color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;cursor:pointer;border:2px solid transparent}
.fchip.on{border-color:var(--accent);color:var(--accent-d);font-weight:650}
.fchip i{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:5px}
label.f{display:block;margin:0 0 14px}label.f>span{display:block;font-weight:650;font-size:14px;margin:0 2px 6px}
input[type=text],input[type=number],input[type=search],textarea,select{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;outline:none}
textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:5px 3px 0}
.choice{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.choice input{display:none}.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice.off{opacity:.5;cursor:not-allowed}.choice .ci{font-size:24px}.choice b{display:block}.choice small{color:var(--muted)}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg label{flex:1}.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
.seg input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d)}
.check{display:flex;gap:10px;align-items:center;margin:2px 2px 14px;font-size:14px}.check input{width:20px;height:20px;accent-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:6px}
.btn:active{filter:brightness(.93)}.btn[disabled]{opacity:.6}
.btn.ghost{background:var(--accent-soft);color:var(--accent-d)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:2px dashed var(--accent);border-radius:16px;color:var(--accent-d);font-weight:650;cursor:pointer;background:var(--accent-soft)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:0 0 10px}
.fthumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;text-align:center;padding:6px}
.fthumb img,.fthumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fthumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:14px;line-height:1;z-index:2}
.fthumb .n{position:relative;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.kv{margin-bottom:12px}.k{font-size:12.5px;color:var(--muted);margin-bottom:2px;font-weight:600}.v{white-space:pre-wrap;word-break:break-word}
.att{display:grid;grid-template-columns:1fr;gap:10px}.att img,.att video{width:100%;border-radius:14px;max-height:360px;object-fit:contain;background:var(--bg2)}
.afile{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:14px;background:var(--bg2);cursor:pointer;font-size:14px}
.quote{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 12px 12px 0;white-space:pre-wrap}
.grp{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-weight:700}.grp small{color:var(--muted);font-weight:500}
.person{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:8px}
.person .av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.rm{border:0;background:transparent;color:var(--bad);font-size:20px;padding:4px 8px;cursor:pointer}
.tog{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:.2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}.stat b{font-size:22px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
nav .in{display:flex;gap:2px;background:var(--card);border-radius:24px;box-shadow:0 8px 30px rgba(120,80,100,.18);padding:6px;width:100%;max-width:520px}
nav a{flex:1;text-align:center;padding:7px 2px;border-radius:18px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative}
nav a b{display:block;font-size:20px;font-weight:400;line-height:1.2}nav a.on{background:var(--accent-soft);color:var(--accent-d);font-weight:650}
nav a i{position:absolute;top:2px;right:14%;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:0 5px;min-width:16px}
#sbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:.2s}#sbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .25s;max-width:640px;margin:0 auto}
#sheet.on{transform:none}#sheet h3{margin:0 0 12px;font-size:18px;color:var(--text)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;z-index:30;transition:.3s;max-width:90%;text-align:center;font-size:14px}#toast.on{transform:translate(-50%,0)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.bub.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}.bub.a{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.bub code{background:var(--bg2);padding:1px 5px;border-radius:6px}
.ask{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:6px 0}.ask input{flex:1}.ask .btn{width:auto;margin:0;padding:0 18px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}.empty b{font-size:34px;display:block;margin-bottom:6px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
</style>
</head>
<body>
<div id="view"></div>
<nav id="nav"></nav>
<div id="sbg"></div><div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {} }
document.documentElement.dataset.theme = (tg && tg.colorScheme === 'dark') ? 'dark' : 'light';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND = {app:['📝','Анкета'], complaint:['🚨','Жалоба'], appeal:['⚖️','Апелляция'], homework:['📚','Домашнее задание']};
let ME = null, FILES = [], CHAT = [], INB = {kind:'', status:'active', q:'', page:0};

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),3200); }
function haptic(k){ try{ tg.HapticFeedback.notificationOccurred(k); }catch(e){} }
function fmtSize(n){ return n>1048576 ? (n/1048576).toFixed(1)+' МБ' : Math.max(1,Math.round(n/1024))+' КБ'; }
function go(p){ if(location.hash==='#'+p) render(); else location.hash='#'+p; }
function fmtText(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>'); }
function openLink(u){ const abs = u.startsWith('http') ? u : location.origin + u; if(tg && tg.openLink) tg.openLink(abs); else window.open(abs,'_blank'); }

async function api(path, opts = {}) {
  const headers = {'X-Init-Data': tg ? tg.initData : '', ...(opts.headers || {})};
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const r = await fetch(path, {...opts, headers});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('Ошибка ' + r.status));
  return j;
}
const post = (p, o) => api(p, {method:'POST', body: JSON.stringify(o || {})});

/* ───── bottom sheet ───── */
function openSheet(html){ $('#sheet').innerHTML = html; $('#sheet').classList.add('on'); $('#sbg').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#sbg').classList.remove('on'); }
$('#sbg').onclick = closeSheet;

/* ───── navigation ───── */
function buildNav(root){
  const p = ME.perms, staff = p.review_app || p.review_complaint || p.review_homework;
  const items = [['home','🏠','Главная'],['ai','✨','ИИ'],['my','📂','Мои']];
  if (staff) items.push(['inbox','🛎','Входящие']);
  items.push(['people','👥','Состав']);
  $('#nav').innerHTML = '<div class="in">' + items.map(([k,e,l]) =>
    `<a data-go="/${k}" class="${root===k?'on':''}"><b>${e}</b>${l}${k==='inbox'&&ME.inbox_new?`<i>${ME.inbox_new}</i>`:''}</a>`).join('') + '</div>';
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { closeSheet(); go(g.dataset.go); return; }
  const o = e.target.closest('[data-open]'); if (o) { openLink(o.dataset.open); return; }
});
window.addEventListener('hashchange', render);
if (tg) tg.BackButton.onClick(() => history.back());

/* ───── views ───── */
async function render(){
  if (!ME) return;
  const parts = (location.hash.slice(1) || '/home').split('/');   // ['', route, arg]
  const root = parts[1] || 'home', arg = parts[2];
  closeSheet(); window.scrollTo(0,0);
  if (tg) { if (root === 'home') tg.BackButton.hide(); else tg.BackButton.show(); }
  buildNav(['home','ai','my','inbox','people'].includes(root) ? root : (root==='t' ? 'my' : root==='new' ? 'home' : 'home'));
  const v = $('#view');
  try {
    if (root === 'home') await viewHome(v);
    else if (root === 'new') viewForm(v, arg);
    else if (root === 'my') await viewMy(v);
    else if (root === 't') await viewTicket(v, arg);
    else if (root === 'inbox') await viewInbox(v);
    else if (root === 'people') await viewPeople(v);
    else if (root === 'settings') await viewSettings(v);
    else if (root === 'ai') viewAI(v);
    else await viewHome(v);
  } catch (e) { v.innerHTML = `<div class="empty"><b>🍂</b>${esc(e.message)}</div>`; }
}

async function viewHome(v){
  const p = ME.perms, staff = p.review_app || p.review_complaint || p.review_homework;
  const tile = (k,e,t,s) => `<div class="tile" data-go="/new/${k}"><div class="e">${e}</div><b>${t}</b><span>${s}</span></div>`;
  v.innerHTML = `
  <div class="hero"><div class="avatar">${esc((ME.user.first_name||'?')[0].toUpperCase())}</div>
    <div><div class="hello">Привет, ${esc(ME.user.first_name)} ✧</div>
    <div class="role-chip">${esc(ME.role_label)}</div><div class="muted small">${esc(ME.role_sub)}</div></div></div>
  ${staff && ME.inbox_new ? `<div class="banner" data-go="/inbox"><span>🛎</span><span class="grow">Новых обращений: ${ME.inbox_new}</span><span>›</span></div>` : ''}
  <div class="grid">
    ${tile('app','📝','Анкета','Вступить в команду')}
    ${tile('complaint','🚨','Жалоба','Сообщить о нарушении')}
    ${tile('appeal','⚖️','Апелляция','Разбан · размьют · варн')}
    ${tile('homework','📚','Домашка','Отправить задание')}
    <div class="tile wide" data-go="/ai"><div class="e">✨</div><div><b>ИИ-помощник</b><br><span>Быстро спросить о чём угодно</span></div></div>
    ${ME.article_url ? `<div class="tile wide" data-open="${esc(ME.article_url)}"><div class="e">📖</div><div><b>О чинах</b><br><span>Божества, Ангелы, Стражи и все остальные</span></div></div>` : ''}
    ${p.settings ? `<div class="tile wide" data-go="/settings"><div class="e">⚙️</div><div><b>Настройки</b><br><span>Вакансии и стиль названий чинов</span></div></div>` : ''}
  </div><div id="st"></div>`;
  if (p.stats) {
    try {
      const s = await api('/api/stats'); let html = '<h3>📊 Статистика</h3><div class="stats">';
      for (const k in KIND) { const x = s.tickets[k] || {}; const tot = Object.values(x).reduce((a,b)=>a+b,0);
        html += `<div class="stat"><span class="muted small">${KIND[k][0]} ${KIND[k][1]}</span><b>${tot}</b><span class="small muted">новых ${x.new||0} · в работе ${x.work||0}</span></div>`; }
      $('#st').innerHTML = html + `<div class="stat"><span class="muted small">👥 Участников</span><b>${s.users}</b><span class="small muted">в команде ${s.staff}</span></div></div>`;
    } catch (e) {}
  }
}

/* ───── файлы ───── */
function filesBlock(){
  return `<span style="display:block;font-weight:650;font-size:14px;margin:0 2px 6px">Вложения</span>
  <div class="files" id="flist"></div>
  <label class="drop"><input type="file" id="fin" multiple hidden>📎 Прикрепить фото, видео или файлы</label>
  <div class="hint">До ${ME.limits.max_files} файлов, каждый до ${ME.limits.max_file_mb} МБ</div>`;
}
function drawFiles(){
  $('#flist').innerHTML = FILES.map((f,i) => {
    const t = f.file.type, url = f.url;
    const inner = t.startsWith('image/') ? `<img src="${url}">` : t.startsWith('video/') ? `<video src="${url}" muted playsinline></video>` : `<div>📄</div><div class="n">${esc(f.file.name)}</div>`;
    return `<div class="fthumb">${inner}<button type="button" class="x" data-rm="${i}">×</button></div>`;
  }).join('');
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { URL.revokeObjectURL(FILES[+b.dataset.rm].url); FILES.splice(+b.dataset.rm,1); drawFiles(); });
}
function bindFiles(){
  $('#fin').onchange = e => {
    for (const file of e.target.files) {
      if (FILES.length >= ME.limits.max_files) { toast(`Можно до ${ME.limits.max_files} файлов 🌿`); break; }
      if (file.size > ME.limits.max_file_mb * 1048576) { toast(`«${file.name}» больше ${ME.limits.max_file_mb} МБ 🌿`); continue; }
      FILES.push({file, url: URL.createObjectURL(file)});
    }
    e.target.value = ''; drawFiles();
  };
  drawFiles();
}

/* ───── формы ───── */
const fld = (label, inner, hint) => `<label class="f"><span>${label}</span>${inner}${hint?`<div class="hint">${hint}</div>`:''}</label>`;
const noEv = '<label class="check"><input type="checkbox" name="no_evidence"> У меня нет доказательств</label>';

function viewForm(v, kind){
  if (!KIND[kind]) return go('/home');
  FILES.forEach(f => URL.revokeObjectURL(f.url)); FILES = [];
  let body = '', sub = '';
  if (kind === 'app') {
    sub = 'Расскажи о себе — нам правда интересно ☕';
    body = `<span style="display:block;font-weight:650;font-size:14px;margin:0 2px 8px">Должность</span>` +
      ME.vacancies.map(x => `<label class="choice ${x.open?'':'off'}"><input type="radio" name="vac" value="${x.key}" ${x.open?'':'disabled'}><span class="ci">${x.icon}</span><span class="grow"><b>${esc(x.title)}</b><small>${x.open?'🟢 Набор открыт':'🔴 Набор закрыт'}</small></span></label>`).join('') +
      fld('Имя', '<input type="text" name="name" maxlength="64" placeholder="Как тебя зовут?">') +
      fld('Возраст (полных лет)', '<input type="number" name="age" inputmode="numeric" min="5" max="99" placeholder="17">') +
      `<div id="subj" hidden>${fld('Профильный предмет', '<input type="text" name="subject" maxlength="100" placeholder="Например: создание ОС, монтаж, атмосфера…">', 'По какому предмету ты хочешь обучать')}</div>` +
      fld('Почему мы должны тебя принять?', '<textarea name="reason" maxlength="1500" placeholder="Расскажи о себе и своих сильных сторонах…"></textarea>') +
      fld('Портфолио (по желанию)', '<input type="text" name="portfolio" maxlength="500" placeholder="Ссылка или описание работ">') +
      `<div class="card">${filesBlock()}</div>`;
  } else if (kind === 'complaint') {
    sub = 'Расскажи, что случилось, — мы спокойно во всём разберёмся ☕';
    body = fld('Кто тебя беспокоит?', '<input type="text" name="who" maxlength="200" placeholder="Ник, @username или ссылка">') +
      fld('Причина беспокойства', '<textarea name="reason" maxlength="1500" placeholder="Расскажи, как всё было…"></textarea>') +
      fld('Доказательства (текст)', '<textarea name="evidence" maxlength="1000" style="min-height:80px" placeholder="Ссылки, пояснения…"></textarea>') +
      `<div class="card">${filesBlock()}</div>` + noEv;
  } else if (kind === 'appeal') {
    sub = 'Бывает всякое — давай спокойно разберёмся ☕';
    body = '<span style="display:block;font-weight:650;font-size:14px;margin:0 2px 8px">Что оспариваем?</span><div class="seg">' +
      Object.entries(ME.appeal_types).map(([k,x],i) => `<label><input type="radio" name="type" value="${k}" ${i?'':'checked'}><span>${x.icon}<br>${esc(x.title)}</span></label>`).join('') + '</div>' +
      fld('Какое правило ты нарушил(а)?', '<input type="text" name="rule" maxlength="300" placeholder="Напиши честно, мы поймём 🌿">') +
      '<span style="display:block;font-weight:650;font-size:14px;margin:0 2px 8px">Ты считаешь, что наказание выдано неверно?</span><div class="seg"><label><input type="radio" name="wrong" value="1" checked><span>✨ Да</span></label><label><input type="radio" name="wrong" value="0"><span>🍃 Нет</span></label></div>' +
      fld('Доказательства (текст)', '<textarea name="evidence" maxlength="1000" style="min-height:80px" placeholder="Ссылки, пояснения…"></textarea>') +
      `<div class="card">${filesBlock()}</div>` + noEv;
  } else {
    sub = 'Отправь работу своему учителю — он обязательно посмотрит ✧';
    const subs = ME.subjects;
    body = `<span style="display:block;font-weight:650;font-size:14px;margin:0 2px 8px">Предмет</span>` +
      subs.map((s,i) => `<label class="choice"><input type="radio" name="spick" value="${esc(s)}" ${i?'':'checked'}><span class="ci">📖</span><span class="grow"><b>${esc(s)}</b></span></label>`).join('') +
      `<label class="choice"><input type="radio" name="spick" value="__other" ${subs.length?'':'checked'}><span class="ci">✏️</span><span class="grow"><b>Другой предмет</b></span></label>` +
      `<div id="sother" hidden>${fld('Название предмета', '<input type="text" name="sother" maxlength="100">')}</div>` +
      fld('Тема работы', '<input type="text" name="title" maxlength="100" placeholder="Например: Задание №3">') +
      fld('Ответ / комментарий', '<textarea name="text" maxlength="3000" placeholder="Напиши ответ или приложи файлы ниже…"></textarea>') +
      `<div class="card">${filesBlock()}</div>`;
  }
  v.innerHTML = `<h2>${KIND[kind][0]} ${KIND[kind][1]}</h2><div class="muted" style="margin:-6px 2px 14px">${sub}</div>
    <form id="form" onsubmit="return false">${body}<div class="bar" id="bar" hidden><div></div></div><button class="btn" id="send">✨ Отправить</button></form>`;
  if ($('#fin')) bindFiles();
  const toggle = () => {
    const f = $('#form');
    if (kind === 'app') $('#subj').hidden = (f.elements.vac.value !== 'teacher');
    if (kind === 'homework') $('#sother').hidden = (f.elements.spick.value !== '__other');
  };
  $('#form').addEventListener('change', toggle); toggle();
  $('#send').onclick = () => submitForm(kind);
}

function submitForm(kind){
  const f = $('#form'); const payload = Object.fromEntries(new FormData(f).entries()); payload.kind = kind;
  if (kind === 'homework') payload.subject = payload.spick === '__other' ? (payload.sother || '') : payload.spick;
  const fd = new FormData(); fd.append('payload', JSON.stringify(payload));
  FILES.forEach(x => fd.append('files', x.file, x.file.name));
  const btn = $('#send'), bar = $('#bar');
  btn.disabled = true; btn.textContent = 'Отправляем…'; bar.hidden = false;
  const xhr = new XMLHttpRequest(); xhr.open('POST', '/api/tickets');
  xhr.setRequestHeader('X-Init-Data', tg ? tg.initData : '');
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.firstElementChild.style.width = Math.round(e.loaded / e.total * 100) + '%'; };
  xhr.onload = () => {
    let j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200) { haptic('success'); toast('Готово! Обращение отправлено ✨'); FILES = []; refreshMe().then(() => go('/t/' + j.id)); }
    else { haptic('error'); toast(j.error || 'Не получилось отправить 🌿'); btn.disabled = false; btn.textContent = '✨ Отправить'; bar.hidden = true; }
  };
  xhr.onerror = () => { toast('Нет связи, попробуй ещё раз 🌿'); btn.disabled = false; btn.textContent = '✨ Отправить'; bar.hidden = true; };
  xhr.send(fd);
}

/* ───── обращения ───── */
const chip = t => `<span class="chip st-${t.status}">${esc(t.status_label)}</span>`;
function item(t, staff){
  const [ic, nm] = KIND[t.kind];
  return `<div class="item" data-go="/t/${t.id}"><div class="ico">${ic}</div><div class="grow"><div class="t">${nm} #${t.id} ${chip(t)}</div>
    <div class="s">${esc(t.title)}</div>${staff ? `<div class="s">👤 ${esc(t.user_name)}${t.username ? ' @' + esc(t.username) : ''}</div>` : ''}</div>
    <div class="muted small">${esc((t.created_at || '').slice(0, 10))}</div></div>`;
}
async function viewMy(v){
  const r = await api('/api/my');
  v.innerHTML = '<h2>📂 Мои обращения</h2>' + (r.items.length ? r.items.map(t => item(t, false)).join('') :
    '<div class="empty"><b>☕</b>Здесь тихо и уютно. Загляни сюда, когда что-нибудь отправишь ✨</div>');
}

function fieldsHTML(t){
  const d = t.data, kv = (k, val) => `<div class="kv"><div class="k">${k}</div><div class="v">${esc(val || '—')}</div></div>`;
  if (t.kind === 'app') { const vac = ME.vacancies.find(x => x.key === d.vac);
    return kv('💼 Должность', vac ? vac.icon + ' ' + vac.title : d.vac) + kv('👤 Имя', d.name) + kv('🎂 Возраст', d.age + ' полных лет') +
      (d.subject ? kv('📚 Профильный предмет', d.subject) : '') + kv('💭 Почему мы должны принять', d.reason) + kv('🗂 Портфолио', d.portfolio); }
  if (t.kind === 'complaint') return kv('👁 Кто беспокоит', d.who) + kv('📄 Причина', d.reason) + kv('🧾 Доказательства', d.evidence);
  if (t.kind === 'appeal') { const a = ME.appeal_types[d.type] || {icon:'', title:d.type};
    return kv('🎯 Тип', a.icon + ' ' + a.title) + kv('📜 Нарушенное правило', d.rule) + kv('⚖️ Наказание выдано неверно', d.wrong ? 'Да' : 'Нет') + kv('🧾 Доказательства', d.evidence); }
  return kv('📖 Предмет', d.subject) + kv('📝 Тема', d.title) + kv('💬 Ответ', d.text);
}
function attHTML(t){
  if (!t.attachments.length) return '';
  return '<h3>📎 Вложения</h3><div class="att">' + t.attachments.map(a =>
    a.kind === 'image' ? `<img src="${a.url}" loading="lazy" data-open="${a.url}">` :
    a.kind === 'video' ? `<video src="${a.url}" controls preload="metadata" playsinline></video>` :
    `<div class="afile" data-open="${a.url}">📄 <span class="grow">${esc(a.name)}</span><span class="muted small">${fmtSize(a.size)}</span></div>`).join('') + '</div>';
}
const ACT = {
  app: {done:'✨ Принять', rejected:'🍂 Отклонить'}, complaint: {done:'✨ Рассмотрено', rejected:'🍂 Отклонить'},
  appeal: {done:'✨ Удовлетворить', rejected:'🍂 Отклонить'}, homework: {done:'✨ Зачесть', rejected:'🍂 На доработку'}
};
async function viewTicket(v, id){
  const {ticket: t} = await api('/api/tickets/' + id);
  const [ic, nm] = KIND[t.kind];
  v.innerHTML = `<h2>${ic} ${nm} #${t.id}</h2>
  <div class="card"><div>${chip(t)}<span class="muted small"> · ${esc(t.created_at)}</span></div>
  ${!t.is_mine ? `<div class="kv" style="margin-top:12px"><div class="k">👤 Отправитель</div><div class="v"><a href="tg://user?id=${t.user_id}">${esc(t.user_name)}</a>${t.username ? ' @' + esc(t.username) : ''} · <code>${t.user_id}</code></div></div>` : ''}
  <div style="margin-top:12px">${fieldsHTML(t)}</div>${attHTML(t)}</div>
  ${t.resolution ? `<h3>💬 Комментарий от команды</h3><div class="quote">${esc(t.resolution)}</div>` : ''}
  ${t.handled_by && !t.is_mine ? `<div class="muted small" style="margin:10px 2px">🧑‍💼 Рассмотрел(а): ${esc(t.handled_by)} · ${esc(t.handled_at || '')}</div>` : ''}
  ${t.can_act ? `<h3>Действия</h3>
    ${t.status === 'new' ? '<button class="btn ghost" data-a="work">☕ Взять в работу</button>' : ''}
    <div class="row" style="margin-top:8px"><button class="btn ok" data-a="done">${ACT[t.kind].done}</button><button class="btn bad" data-a="rejected">${ACT[t.kind].rejected}</button></div>
    <button class="btn ghost" data-a="reply" style="margin-top:8px">💬 Написать пользователю</button>` : ''}`;
  v.querySelectorAll('[data-a]').forEach(b => b.onclick = () => actSheet(t, b.dataset.a));
}
function actSheet(t, act){
  if (act === 'work') return doAct(t.id, 'work', '');
  const titles = {done: ACT[t.kind].done, rejected: ACT[t.kind].rejected, reply: '💬 Сообщение пользователю'};
  openSheet(`<h3>${titles[act]}</h3><label class="f"><span>${act==='reply' ? 'Сообщение' : 'Комментарий (по желанию)'}</span>
    <textarea id="cm" maxlength="1500" placeholder="Напиши тёплое слово ✧"></textarea></label>
    <button class="btn" id="ok">Отправить</button>`);
  $('#ok').onclick = () => doAct(t.id, act, $('#cm').value);
}
async function doAct(id, action, comment){
  try {
    const r = await post(`/api/tickets/${id}/act`, {action, comment}); closeSheet(); haptic('success');
    toast(r.delivered ? 'Готово, пользователь уведомлён ☕' : 'Готово, но уведомить не получилось 🌿');
    await refreshMe(); render();
  } catch (e) { haptic('error'); toast(e.message); }
}

/* ───── входящие ───── */
async function viewInbox(v){
  const p = ME.perms, kinds = [['', '🗂 Все']];
  if (p.review_app) kinds.push(['app','📝 Анкеты']);
  if (p.review_complaint) kinds.push(['complaint','🚨 Жалобы']); if (p.review_appeal) kinds.push(['appeal','⚖️ Апелляции']);
  if (p.review_homework) kinds.push(['homework','📚 Домашки']);
  v.innerHTML = `<h2>🛎 Входящие</h2><div class="chips" id="kc"></div>
    <div class="chips"><div class="fchip" data-s="active">🌱 Активные</div><div class="fchip" data-s="all">📚 Все</div></div>
    <input type="search" id="q" placeholder="🔍 Поиск: имя, @username, id, №" value="${esc(INB.q)}" style="margin-bottom:12px">
    <div id="list"></div><div id="more"></div>`;
  let counts = {};
  const drawChips = () => {
    $('#kc').innerHTML = kinds.map(([k,l]) => `<div class="fchip ${INB.kind===k?'on':''}" data-k="${k}">${l}${k && counts[k] ? `<i>${counts[k]}</i>` : ''}</div>`).join('');
    v.querySelectorAll('[data-s]').forEach(e => e.classList.toggle('on', e.dataset.s === INB.status));
    v.querySelectorAll('[data-k]').forEach(e => e.onclick = () => { INB.kind = e.dataset.k; INB.page = 0; load(); });
  };
  const load = async (append) => {
    const qs = new URLSearchParams({kind: INB.kind, status: INB.status, q: INB.q, page: INB.page});
    const r = await api('/api/inbox?' + qs); counts = r.counts; drawChips();
    const html = r.items.map(t => item(t, true)).join('');
    $('#list').innerHTML = (append ? $('#list').innerHTML : '') + (html || (append ? '' : '<div class="empty"><b>✨</b>Здесь пока ничего нет, тишина и покой ☕</div>'));
    $('#more').innerHTML = r.more ? '<button class="btn ghost" id="mb">Показать ещё</button>' : '';
    if (r.more) $('#mb').onclick = () => { INB.page++; load(true); };
  };
  v.querySelectorAll('[data-s]').forEach(e => e.onclick = () => { INB.status = e.dataset.s; INB.page = 0; load(); });
  let tm; $('#q').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { INB.q = e.target.value; INB.page = 0; load(); }, 350); };
  drawChips(); await load();
}

/* ───── состав ───── */
const ORDER = ['owner','coowner','admin','senior_mod','junior_mod','teacher'];
function roleName(k){ const r = ME.roles[k]; return ME.style === 'plain' ? r.plain : r.god; }
function roleGroup(k){ const r = ME.roles[k]; return ME.style === 'plain' ? r.pplain : r.pgod; }
async function viewPeople(v){
  const r = await api('/api/staff'), can = ME.assignable.length > 0;
  const person = (name, un, sub, rm) => `<div class="person"><div class="av">${esc((name||'?')[0].toUpperCase())}</div>
    <div class="grow"><div><b>${esc(name)}</b> ${un ? `<span class="muted small">@${esc(un)}</span>` : ''}</div>${sub ? `<div class="muted small">${sub}</div>` : ''}</div>${rm || ''}</div>`;
  let h = `<h2>👥 Состав</h2><div class="muted" style="margin:-6px 2px 8px">Кто есть кто в нашем сообществе ✧</div>
    ${can ? '<button class="btn" id="addp">➕ Назначить чин</button>' : ''}
    <div class="grp">${ME.roles.creator.icon} ${esc(ME.style === 'plain' ? 'Создатель' : 'Бог')}</div>${person(r.creator.name, r.creator.username, 'Создатель бота · выше всех')}`;
  for (const k of ORDER) {
    const list = r.members.filter(m => m.role === k);
    h += `<div class="grp">${ME.roles[k].icon} ${esc(roleGroup(k))} <small>${list.length}</small></div>`;
    h += list.length ? list.map(m => person(m.name, m.username, (m.pending ? '⏳ получит чин после первого входа · ' : '') + (m.subject ? '📖 ' + esc(m.subject) : ''), m.can_remove ? `<button class="rm" data-rm="${m.id}">🗑</button>` : '')).join('') : '<div class="muted small" style="margin:0 4px 6px">Пока никого</div>';
  }
  h += `<div class="grp">${ME.roles.member.icon} ${esc(roleGroup('member'))} <small>${r.member_count}</small></div>`;
  v.innerHTML = h;
  v.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (!confirm('Снять чин?')) return;
    try { await api('/api/staff/' + b.dataset.rm, {method:'DELETE'}); toast('Чин снят 🍃'); viewPeople(v); } catch (e) { toast(e.message); }
  });
  if (can) $('#addp').onclick = () => {
    openSheet(`<h3>➕ Назначить чин</h3>
      <label class="f"><span>@username или Telegram ID</span><input type="text" id="id1" placeholder="@username или 123456789"></label>
      <label class="f"><span>Чин</span><select id="role">${ME.assignable.map(k => `<option value="${k}">${ME.roles[k].icon} ${esc(roleName(k))}</option>`).join('')}</select></label>
      <div id="sbj" hidden><label class="f"><span>Предмет учителя</span><input type="text" id="sj" placeholder="Например: монтаж"><div class="hint">Можно несколько через запятую</div></label></div>
      <button class="btn" id="ok">Назначить</button>`);
    const t = () => $('#sbj').hidden = $('#role').value !== 'teacher'; $('#role').onchange = t; t();
    $('#ok').onclick = async () => {
      try { const j = await post('/api/staff', {ident: $('#id1').value, role: $('#role').value, subject: $('#sj').value});
        closeSheet(); toast(j.pending ? 'Чин выдастся после первого входа человека ⏳' : 'Чин назначен ✨'); haptic('success'); viewPeople(v);
      } catch (e) { toast(e.message); }
    };
  };
}

/* ───── настройки ───── */
async function viewSettings(v){
  if (!ME.perms.settings) return go('/home');
  v.innerHTML = `<h2>⚙️ Настройки</h2><h3>Вакансии</h3>` +
    ME.vacancies.map(x => `<div class="tog"><span style="font-size:24px">${x.icon}</span><div class="grow"><b>${esc(x.title)}</b><div class="muted small">${x.open ? '🟢 Набор открыт' : '🔴 Набор закрыт'}</div></div><div class="sw ${x.open ? 'on' : ''}" data-v="${x.key}"></div></div>`).join('') +
    `<h3>Названия чинов</h3><div class="seg"><label><input type="radio" name="st" value="god" ${ME.style==='god'?'checked':''}><span>👑 Стилизованные<br><small>Божество, Ангел…</small></span></label><label><input type="radio" name="st" value="plain" ${ME.style==='plain'?'checked':''}><span>📋 Обычные<br><small>Владелец, Учитель…</small></span></label></div>`;
  v.querySelectorAll('[data-v]').forEach(s => s.onclick = async () => {
    try { await post('/api/vacancies/' + s.dataset.v); await refreshMe(); viewSettings(v); haptic('success'); } catch (e) { toast(e.message); }
  });
  v.querySelectorAll('[name=st]').forEach(r => r.onchange = async () => {
    try { await post('/api/settings', {style: r.value}); await refreshMe(); toast('Готово ✨'); } catch (e) { toast(e.message); }
  });
}

/* ───── ИИ ───── */
function viewAI(v){
  if (!ME.ai) { v.innerHTML = '<div class="empty"><b>🌿</b>ИИ-помощник пока не настроен</div>'; return; }
  const draw = () => {
    $('#chat').innerHTML = (CHAT.length ? CHAT.map(m => `<div class="bub ${m.role==='user'?'u':'a'}">${fmtText(m.text)}</div>`).join('') :
      '<div class="empty"><b>✨</b>Спроси меня о чём угодно ☕<br><span class="small">Например: «Как написать хорошую анкету?»</span></div>') +
      (CHAT.pending ? '<div class="bub a dots"><span></span><span></span><span></span></div>' : '');
    window.scrollTo(0, document.body.scrollHeight);
  };
  v.innerHTML = `<h2>✨ ИИ-помощник</h2><div class="chat" id="chat"></div>
    <div class="ask"><input type="text" id="aq" placeholder="Задай вопрос…" maxlength="1000"><button class="btn" id="as">➤</button></div>
    ${CHAT.length ? '<button class="btn ghost sm" id="ac">🧹 Очистить</button>' : ''}`;
  draw();
  const send = async () => {
    const q = $('#aq').value.trim(); if (!q || CHAT.pending) return;
    const history = CHAT.slice(-8); CHAT.push({role:'user', text:q}); CHAT.pending = true; $('#aq').value = ''; draw();
    try { const r = await post('/api/ai', {prompt: q, history}); CHAT.push({role:'model', text: r.answer}); }
    catch (e) { CHAT.push({role:'model', text: e.message}); }
    CHAT.pending = false; draw();
  };
  $('#as').onclick = send; $('#aq').onkeydown = e => { if (e.key === 'Enter') send(); };
  if ($('#ac')) $('#ac').onclick = () => { CHAT = []; viewAI(v); };
}

/* ───── запуск ───── */
async function refreshMe(){ try { ME = await api('/api/me'); } catch (e) {} }
(async () => {
  try {
    ME = await api('/api/me');
    const q = new URLSearchParams(location.search).get('open') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param);
    if (q && /^\d+$/.test(q) && !location.hash) location.hash = '#/t/' + q;
    render();
  } catch (e) {
    $('#view').innerHTML = `<div class="empty"><b>🍂</b>${esc(e.message)}<br><span class="small">Открой приложение через бота в Telegram</span></div>`;
  }
})();
</script>
